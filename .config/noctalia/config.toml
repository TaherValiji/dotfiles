[shell]
polkit_agent = true
app_icon_colorize = true
font_family = "JetBrains Mono ExtraBold"

    [shell.animation]
    speed = 1.5000000223517418

    [shell.panel]
    open_near_click_control_center = true
    shadow = false
    transparency_mode = "glass"

[system.monitor]
cpu_poll_seconds = 5
gpu_poll_seconds = 10
memory_poll_seconds = 5

[theme]
builtin = "Tokyo-Night"
community_palette = "Cream Autumn"
custom_palette = "Cream Autumn"
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
source = "custom"
wallpaper_scheme = "vibrant"

[bar.default]
background_opacity = 0.0
capsule = true
capsule_radius = 5
capsule_thickness = 0.64999998919665813
center = [ "clock", "date" ]
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "session" ]
margin_ends = 25
padding = 0
shadow = false
start = [ "workspaces" ]
